server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: identity-auth
          uri: http://${IDENTITY_SERVICE_HOST:localhost}:${IDENTITY_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: template-service
          uri: http://${TEMPLATE_SERVICE_HOST:localhost}:${TEMPLATE_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/templates/**, /api/v1/categories/**, /api/v1/elements/**, /api/v1/admin/**

        - id: project-service
          uri: http://${PROJECT_SERVICE_HOST:localhost}:${PROJECT_SERVICE_PORT:8083}
          predicates:
            - Path=/api/v1/projects/**

        - id: media-service
          uri: http://${MEDIA_SERVICE_HOST:localhost}:${MEDIA_SERVICE_PORT:8084}
          predicates:
            - Path=/api/v1/media/**

        - id: ai-service
          uri: http://${AI_SERVICE_HOST:localhost}:${AI_SERVICE_PORT:8085}
          predicates:
            - Path=/api/v1/ai/**

        - id: billing-service
          uri: http://${BILLING_SERVICE_HOST:localhost}:${BILLING_SERVICE_PORT:8086}
          predicates:
            - Path=/api/v1/billing/**, /api/v1/subscriptions/**

        - id: tools-service
          uri: http://${TOOLS_SERVICE_HOST:localhost}:${TOOLS_SERVICE_PORT:8087}
          predicates:
            - Path=/api/v1/tools/**, /api/tools/**

jwt:
  secret: ${JWT_SECRET:super-secret-marathi-design-studio-jwt-key-minimum-256-bits-long-key-for-hmac-sha256}

management:
  endpoints:
    web:
      exposure:
        include: health,info
